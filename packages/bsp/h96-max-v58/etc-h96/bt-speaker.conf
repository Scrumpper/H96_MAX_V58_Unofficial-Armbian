# /etc/h96/bt-speaker.conf -- h96-bt-speaker overrides. Sourced as shell.
# All keys optional; defaults shown.

# Name phones see when pairing.
#ALIAS="H96 Max V58 Speaker"

# Discoverable window in seconds when 'on' is called with no argument.
# 0 = stay discoverable until 'h96-bt-speaker off'.
#DISCOVERABLE_TIMEOUT=0

# Playback sink node.name. Empty = default sink (HDMI on this box).
# List candidates:  pactl list short sinks   /   wpctl status
# Example HDMI sink node.name:
#SINK="alsa_output.platform-hdmi-sound.stereo-fallback"

# Set adapter Class of Device to Audio/Loudspeaker so phones show the box as a
# speaker. 1 = yes (needs hciconfig), 0 = leave adapter class as-is.
#SET_CLASS=1
