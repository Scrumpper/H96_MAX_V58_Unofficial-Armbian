# /etc/h96/cec-keymap.conf
# CEC user-control key -> Linux input key symbol.
# Left side: normalized CEC key name (lowercase, "-" between words).
# Right side: a KEY_* symbol from <linux/input-event-codes.h>.
# Edit to taste, then: sudo systemctl restart h96-cec.service
#
# Only overrides need to be listed; anything omitted uses the built-in default
# (see /usr/local/lib/h96/h96-cecd, DEFAULT_MAP).
#
# Navigation
select      = KEY_ENTER
up          = KEY_UP
down        = KEY_DOWN
left        = KEY_LEFT
right       = KEY_RIGHT
exit        = KEY_ESC
back        = KEY_BACK
return      = KEY_BACK
root-menu   = KEY_MENU
info        = KEY_INFO
#
# Media transport (works in mpv and Kodi)
play        = KEY_PLAYPAUSE
pause       = KEY_PLAYPAUSE
stop        = KEY_STOPCD
rewind      = KEY_REWIND
fast-forward= KEY_FASTFORWARD
forward     = KEY_NEXTSONG
backward    = KEY_PREVIOUSSONG
#
# Volume (usually the box handles volume; TVs often keep these local)
volume-up   = KEY_VOLUMEUP
volume-down = KEY_VOLUMEDOWN
mute        = KEY_MUTE
#
# For Kodi you may prefer back -> KEY_BACKSPACE instead of KEY_BACK:
# back      = KEY_BACKSPACE
