# /etc/h96/transcode.conf - h96-transcode-server settings.
# The box hardware-transcodes videos dropped into the IN dir (rkmpp VPU: hw
# decode + hw encode, ~7x realtime at 1080p). Edit and restart the service:
#   sudo systemctl restart h96-transcode-server

# Output video codec: hevc (smaller, default) | h264 (most compatible) | mjpeg
CODEC=hevc

# Target video bitrate (ffmpeg -b:v). e.g. 6M, 10M, 4M.
BITRATE=6M

# Output container / extension.
CONTAINER=mp4

# Downscale before encoding, e.g. SCALE=1280x720. Empty keeps source resolution.
SCALE=

# 1 = try rkmpp HARDWARE decode first (fastest); falls back to software decode.
HWDEC=1

# Seconds between IN-dir scans (also the file-stable wait).
POLL=3

# 1 = keep each original in done/ after success; 0 = delete it.
KEEP_SOURCE=1

# Folder root. Served data lives here; export it over Samba/NFS if you want a
# mountable share, or just drop files over SFTP (ssh) into $ROOT/in.
ROOT=/srv/h96-transcode
