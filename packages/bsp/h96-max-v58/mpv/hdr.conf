# /etc/mpv/hdr.conf  -- H96 HDR10 drop-in for mpv (managed by h96-hdr)
#
# mpv does NOT read this file on its own. It becomes active only when the main
# /etc/mpv/mpv.conf contains an include line pointing at it:
#
#     include=/etc/mpv/hdr.conf
#
# `sudo h96-hdr tonemap` adds that line (inside a marked block, appended LAST so
# these settings win over the vo=gpu set earlier in mpv.conf) and rewrites this
# file for the chosen mode. `sudo h96-hdr off` removes the include line again.
# The existing mpv.conf is never rewritten beyond that one marked block.
#
# ---------------------------------------------------------------------------
# MODE: tonemap   HDR10 / BT.2020 PQ  ->  SDR BT.709   (safe default on X11)
# ---------------------------------------------------------------------------
#
# vo=gpu-next routes rendering through libplacebo, which owns tone-mapping,
# gamut mapping and OSD. CONFIRM it starts on this board before trusting it:
#     h96-hdr test
# libplacebo runs on Panfrost GLES (gpu-api=opengl, default here) and can also
# use PanVK (gpu-api=vulkan); the GLES path is the safe one on 6.1.
#
# hwdec stays rkmpp: libplacebo imports the VPU DMA-BUF frames via the same GL
# interop path vo=gpu used, so hardware decode is preserved.

vo=gpu-next

# Tone-map DOWN to SDR. Do NOT hint the display: target-colorspace-hint has no
# effect under X11 (it is honoured only on Wayland / DRM-KMS / D3D11), so the
# only correct behaviour in the KDE-on-X11 session is to convert to SDR here.
target-colorspace-hint=no
target-prim=bt.709
target-trc=bt.1886

# Tone-mapping curve. bt.2390 is the neutral reference curve; `spline` is a
# common perceptual alternative. tone-mapping-mode=auto lets libplacebo pick
# per-channel vs luma. gamut-mapping-mode=perceptual keeps saturated highlights
# from clipping to nonsense.
tone-mapping=bt.2390
tone-mapping-mode=auto
gamut-mapping-mode=perceptual

# Measure the real per-frame peak instead of trusting static HDR10 metadata
# (which is often wrong). This uses a GLES 3.1 compute shader; the Mali-G610
# supports it, but if 4K HDR playback stutters, comment this ONE line out.
hdr-compute-peak=yes
