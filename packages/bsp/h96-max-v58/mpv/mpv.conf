# H96/RK3588 VPU decode; rkmpp-copy fallback (zero-copy DRM interop unavailable on X11)
profile=fast
hwdec=rkmpp,rkmpp-copy
vo=gpu
# 8-bit VP9 first (vp9.2 HDR decodes in software), no AV1 (no hw decode), up to 4K
ytdl-format=bestvideo[height<=?2160][vcodec=vp9]+bestaudio/bestvideo[height<=?2160][vcodec!*=av01]+bestaudio/best[height<=?2160]
ytdl-raw-options=js-runtimes=node
cache=yes
demuxer-max-bytes=64MiB
cursor-autohide=1000
# fullscreen skips KWin compositing (drops at 4K output)
x11-bypass-compositor=fs-only
