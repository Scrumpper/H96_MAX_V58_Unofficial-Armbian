# 90-h96-eq.conf  --  H96 Max V58 system parametric EQ (reference/static copy)
#
# Drop-in for /etc/pipewire/pipewire.conf.d/ . This is the EQ-only, no-crossfeed
# baseline that h96-audio-eq generates. The tool normally REGENERATES this file
# on enable/load (pinning playback.props.target.object to the detected HDMI
# sink and injecting crossfeed nodes when asked). Ship this as the default so
# the virtual sink exists even before the tool is run; then a single
# `h96-audio-eq enable` makes it the default output.
#
# The builtin `param_eq` node reads an AutoEQ / APO ParametricEQ.txt file:
#   /etc/h96/eq/active.txt   (managed by: h96-audio-eq load <preset>)
# If that file is absent the node is a passthrough (0 dB), so this config is
# safe to ship with no active preset yet.

context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "H96 EQ Sink"
      media.name       = "H96 EQ Sink"
      filter.graph = {
        nodes = [
          {
            type = builtin, name = eq, label = param_eq
            config = { filename = "/etc/h96/eq/active.txt" }
          }
        ]
        links = [ ]
        inputs  = [ "eq:In 1" "eq:In 2" ]
        outputs = [ "eq:Out 1" "eq:Out 2" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name        = "effect_input.h96eq"
        node.description = "H96 EQ Sink"
        media.class      = "Audio/Sink"
        audio.channels   = 2
        audio.position   = [ FL FR ]
      }
      playback.props = {
        node.name    = "effect_output.h96eq"
        node.passive = true
        audio.channels = 2
        audio.position = [ FL FR ]
        # target.object = "alsa_output.platform-hdmi..."   # tool pins this
      }
    }
  }
]
