# 95-h96-silence-source.conf: adds a "Silence (no microphone)" input so KDE's tray selector shows even with one real mic; picking it mutes input. priority.session 1300: above monitors of non-pro sinks (HDMI 1200, others
# 1109 or less), below non-pro ALSA capture devices 0 to 27 (1312 and up) and Bluetooth (2010). Card in
# pro-audio profile outranks it: that sink monitor (1500 and up) becomes fallback input.

context.objects = [
  {
    factory = adapter
    args = {
      factory.name      = support.null-audio-sink
      node.name         = "h96_silence_source"
      node.description  = "Silence (no microphone)"
      media.class       = "Audio/Source/Virtual"
      audio.position    = [ MONO ]
      priority.session  = 1300
      priority.driver   = 1
      monitor.channel-volumes = true
      object.linger     = true
    }
  }
]
