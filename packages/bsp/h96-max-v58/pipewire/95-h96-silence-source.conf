# 95-h96-silence-source.conf: adds a "Silence (no microphone)" input so KDE's tray selector shows even with one real mic; picking it mutes input. Lowest priority: a real mic is always chosen over it.

context.objects = [
  {
    factory = adapter
    args = {
      factory.name      = support.null-audio-sink
      node.name         = "h96_silence_source"
      node.description  = "Silence (no microphone)"
      media.class       = "Audio/Source/Virtual"
      audio.position    = [ MONO ]
      priority.session  = 1
      priority.driver   = 1
      monitor.channel-volumes = true
      object.linger     = true
    }
  }
]
