# 95-h96-silence-source.conf: adds a "Silence (no microphone)" input so KDE's tray selector shows even with one real mic; picking it mutes input. priority.session 1300: above every sink monitor (HDMI 1200, other sinks
# 1109 or less), below every microphone (ALSA capture 1744 - 16 x device number and up, Bluetooth 2010).

context.objects = [
  {
    factory = adapter
    args = {
      factory.name      = support.null-audio-sink
      node.name         = "h96_silence_source"
      node.description  = "Silence (no microphone)"
      media.class       = "Audio/Source/Virtual"
      audio.position    = [ MONO ]
      priority.session  = 1300
      priority.driver   = 1
      monitor.channel-volumes = true
      object.linger     = true
    }
  }
]
