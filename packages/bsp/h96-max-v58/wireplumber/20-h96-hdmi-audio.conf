# /etc/wireplumber/wireplumber.conf.d/20-h96-hdmi-audio.conf
# H96 Max V58 HDMI-TX card (alsa_card.platform-hdmi0-sound, ALSA id rockchiphdmi0).
#
# Card profile layer (ACP) ON with h96 profile set. Profile set is generated by
# `h96-audio-passthrough detect` from TV / AV receiver EDID read over DDC and lists
# only layouts sink supports: Digital Stereo / Surround 5.1 / Surround 7.1 (HDMI).
# KDE shows them as card profiles (tray speaker menu > Profile; System Settings >
# Sound > Profile). Kernel ELD (forced EDID + sink audio blocks) gates each layout
# again when ACP probes it. Card has no jack control: port availability stays
# 'unknown', so sink exists with or without readable ELD.
# Matches HDMI-TX only: S/PDIF card is alsa_card.platform-spdif-tx0-sound.
# Static config: hand-maintained, not regenerated by detect (unlike h96-hdmi.conf /
# 51-h96-iec958.conf, which detect writes fresh each run).
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-hdmi0-sound" } ]
    actions = {
      update-props = {
        api.alsa.use-acp          = true
        api.alsa.use-ucm          = false
        api.acp.disable-pro-audio = true
        device.profile-set        = "/etc/alsa-card-profile/mixer/profile-sets/h96-hdmi.conf"
      }
    }
  }
  {
    # HDMI ahead of S/PDIF when both exist.
    matches = [ { node.name = "~alsa_output.platform-hdmi0-sound.*" } ]
    actions = {
      update-props = {
        priority.driver    = 2000
        priority.session   = 2000
        node.pause-on-idle = false
      }
    }
  }
]
