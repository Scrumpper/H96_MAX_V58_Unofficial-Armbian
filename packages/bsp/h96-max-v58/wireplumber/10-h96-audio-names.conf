# /etc/wireplumber/wireplumber.conf.d/10-h96-audio-names.conf
# H96 Max V58 - readable names for two on-board audio outputs.
#
# PipeWire builds object names from platform device (device-tree node name),
# not ALSA card id:
#   card : alsa_card.platform-hdmi0-sound      (ALSA id rockchiphdmi0)
#          alsa_card.platform-spdif-tx0-sound  (ALSA id rockchipspdiftx)
#   sink : alsa_output.platform-hdmi0-sound.<profile>   (hdmi-stereo, hdmi-surround,
#          hdmi-surround71: suffix follows selected card profile)
#          alsa_output.platform-spdif-tx0-sound.<profile>
# Matches key off full platform prefix, never bare "hdmi": S/PDIF card profile
# can be named hdmi-stereo too, and bare "hdmi" match then renamed S/PDIF.
#
# device.description -> entry in KDE device / configuration list
# node.description   -> entry in sink list and volume OSD
# Routing priority lives in 20-h96-hdmi-audio.conf; files merge, no conflict.

monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-hdmi0-sound" } ]
    actions = {
      update-props = {
        device.description = "HDMI Out"
        device.nick        = "HDMI Out"
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-hdmi0-sound.*" } ]
    actions = {
      update-props = {
        node.description = "HDMI Out"
        node.nick        = "HDMI Out"
      }
    }
  }
  {
    matches = [ { device.name = "alsa_card.platform-spdif-tx0-sound" } ]
    actions = {
      update-props = {
        device.description = "S/PDIF Optical"
        device.nick        = "S/PDIF Optical"
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-spdif-tx0-sound.*" } ]
    actions = {
      update-props = {
        node.description = "S/PDIF Optical"
        node.nick        = "S/PDIF Optical"
      }
    }
  }
]
