# 30-h96-bluetooth.conf: WirePlumber Bluetooth audio - A2DP codec quality + HFP microphone.
# no codec allow-list: PipeWire picks the best each headset supports (LDAC/aptX/AAC/SBC/Opus, HFP LC3-SWB/mSBC/CVSD); AAC needs libspa-0.2-modules-extra.
# HFP mic needs RFCOMM (h96-rfcomm.service) + HFP roles below; mSBC (wideband) is on since this Broadcom controller supports transparent SCO/eSCO over HCI UART at 3 Mbps; CVSD is the fallback.
monitor.bluez.properties = {
  bluez5.enable-sbc-xq    = true
  bluez5.enable-msbc      = true
  bluez5.enable-hw-volume = true
  bluez5.hfp-backend      = native
  bluez5.roles            = [ a2dp_sink a2dp_source hfp_hf hfp_ag hsp_hs hsp_ag ]
}

# mic on demand: autoswitch lists the headset mic at all times, moves it to Handsfree while an app records, back to A2DP after; output is mono while mic is open (classic BT carries no mic on A2DP)
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
}

# forces a 2048-sample cycle (43 ms) while a Bluetooth sink plays, else PipeWire's default 512-sample cycle (10.7 ms) xruns on the encoder + EQ chain (choppy audio); other outputs stay low-latency when headset is idle.
# Bluetooth sinks never suspend on idle, so a headset does not power off or disconnect on its own timer, and sound is not clipped after a pause; costs some battery.
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { node.force-quantum = 2048, session.suspend-timeout-seconds = 0 } }
  }
]
