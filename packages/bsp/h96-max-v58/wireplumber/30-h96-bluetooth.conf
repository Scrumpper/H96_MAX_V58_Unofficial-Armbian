# H96 Max V58 - Bluetooth audio: A2DP codec quality + HFP microphone.
# Install to: /etc/wireplumber/wireplumber.conf.d/30-h96-bluetooth.conf
#
# A2DP output codec preference: LDAC -> aptX-HD -> aptX -> AAC -> SBC-XQ -> SBC.
# AAC needs the libspa-0.2-modules-extra package (FDK-AAC, split out of the base
# PipeWire package for licensing). LDAC needs libldacbt-*; aptX needs libfreeaptx0.
#
# HFP MICROPHONE: headset mic requires the Hands-Free profile, which runs over
# RFCOMM. Enable CONFIG_BT_RFCOMM=m in the kernel (see config/kernel-h96-max-v58.config)
# so rfcomm loads, and autoload it via modules-load.d/rfcomm.conf, or HFP/HSP roles
# below stay dead and the device is pinned to A2DP-only. Codec is CVSD (narrowband):
# reliable on this Broadcom BCM4362A2 UART controller. mSBC (wideband) is left OFF -
# headset and controller both negotiate it, but the transparent-eSCO transport will
# not establish over this chip's UART link (a known Broadcom-UART limitation), and
# enabling it removes the headset profile entirely.
monitor.bluez.properties = {
  bluez5.enable-sbc-xq    = true
  bluez5.enable-msbc      = false
  bluez5.enable-hw-volume = true
  bluez5.hfp-backend      = native
  bluez5.codecs           = [ ldac aptx_hd aptx aac sbc_xq sbc ]
  bluez5.roles            = [ a2dp_sink a2dp_source hfp_hf hfp_ag hsp_hs hsp_ag ]
}
