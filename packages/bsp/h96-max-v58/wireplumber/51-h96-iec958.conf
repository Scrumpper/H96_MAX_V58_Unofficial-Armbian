# /etc/wireplumber/wireplumber.conf.d/51-h96-iec958.conf
# H96 Max V58 -- advertise IEC958 passthrough codecs on the HDMI-TX node so
# PipeWire apps (Kodi, browsers) can bitstream AC3/DTS/E-AC3, and expose an
# iec958 (passthrough) sink alongside the normal PCM sink. Managed by
# h96-audio-passthrough ('codecs on' regenerates this; 'codecs off' / deleting
# the file reverts).
#
# This only ADVERTISES capability. The default HDMI sink stays PCM; apps opt in
# to passthrough. So shipping this enabled does not change stereo/desktop audio.
#
# TrueHD / DTS-HD are intentionally omitted -- HBR/MAT over dw-hdmi-qp is
# unverified on this box (see NOTES box-test).
#
# WirePlumber 1.6 SPA-JSON drop-in (same conf.d style as 30-h96-bluetooth.conf).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.*hdmi.*" }
      { node.name = "alsa_output.*platform-hdmi*" }
    ]
    actions = {
      update-props = {
        iec958.codecs = [ "PCM" "AC3" "DTS" "EAC3" ]
      }
    }
  }
]
