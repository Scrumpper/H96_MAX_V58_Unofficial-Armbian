# /etc/alsa/conf.d/60-h96-hdmi.conf
# H96 Max V58: hdmi:CARD=rockchiphdmi0,DEV=0 for HDMI-TX only. HDMI-TX and S/PDIF cards
# both use driver simple-card, so card config keyed by driver name reaches both; slave
# card is looked up by card id in h96.hdmi_card.<id>. Card without entry: refer fails,
# no hdmi: device (S/PDIF keeps stereo-fallback profile in PipeWire).
# IEC958 channel status (AES0-3) set on open, so passthrough clients (PipeWire IEC958
# sink, mpv --audio-spdif) can mark stream non-audio.
h96.hdmi_card.rockchiphdmi0 "rockchiphdmi0"

cards.simple-card.pcm.hdmi.0 {
	@args [ CARD AES0 AES1 AES2 AES3 ]
	@args.CARD { type string }
	@args.AES0 { type integer }
	@args.AES1 { type integer }
	@args.AES2 { type integer }
	@args.AES3 { type integer }
	type hooks
	slave.pcm {
		type hw
		card {
			@func refer
			name {
				@func concat
				strings [
					"h96.hdmi_card."
					{ @func card_id card $CARD }
				]
			}
		}
		device 0
	}
	hooks.0 {
		type ctl_elems
		hook_args [
			{
				interface PCM
				name "IEC958 Playback Default"
				device 0
				lock true
				preserve true
				optional true
				value [ $AES0 $AES1 $AES2 $AES3 ]
			}
		]
	}
	hint.device 0
}
