# H96 Max V58 open-GPU desktop environment.
# Append these to /etc/environment (or drop in /etc/environment.d/).
#
# The Mali-G610 runs the open Panfrost (GLES) / PanVK (Vulkan) Mesa stack under
# the Panthor kernel driver. Panfrost has no GLX shared-context path, so the Qt
# and KWin compositors must be told to use the EGL/GLES backend or they fall back
# to llvmpipe (software) with no compositing.
QT_XCB_GL_INTEGRATION=xcb_egl
KWIN_COMPOSE=O2ES
