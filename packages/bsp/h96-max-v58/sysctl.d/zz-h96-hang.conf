# Kernel that stops making progress panics and reboots instead of staying powered with the display lit: a task blocked 120s panics (soft-lockup), an oops panics instead of continuing on a damaged kernel, and a panic reboots after 10s on console. The record lands in pstore (/sys/fs/pstore, moved to /var/lib/systemd/pstore next boot).
kernel.hung_task_timeout_secs = 120
kernel.hung_task_panic = 1
kernel.panic_on_oops = 1
kernel.panic = 10
