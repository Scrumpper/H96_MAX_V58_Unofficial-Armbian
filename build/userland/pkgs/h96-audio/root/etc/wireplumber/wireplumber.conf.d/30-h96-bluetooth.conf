# 30-h96-bluetooth.conf: WirePlumber Bluetooth audio, only what differs from WirePlumber 0.5 / PipeWire 1.6 defaults.
# Defaults kept: mSBC, SBC-XQ and hardware volume on unless the PipeWire quirk list disables them for a headset, native HFP backend,
# no codec allow-list (best codec each headset offers; AAC needs libspa-0.2-modules-extra); headset autoswitch off (below).
# HFP mic needs RFCOMM (h96-rfcomm.service).

# roles: same list as v6.x (HSP added for older headsets, LE Audio BAP left out)
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source hfp_hf hfp_ag hsp_hs hsp_ag ]
}

monitor.bluez.rules = [
  # re-request missing A2DP/HFP when the Bluetooth monitor starts (WirePlumber restart drops A2DP on some earbuds)
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = { update-props = { bluez5.auto-connect = [ a2dp_sink hfp_hf ] } }
  }
  # 2048-sample cycle while a Bluetooth sink plays (512 xruns with encoder + EQ); no idle suspend, so headsets do not power off
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { node.force-quantum = 2048, session.suspend-timeout-seconds = 0 } }
  }
]

# profile stays where the user set it: no automatic A2DP <-> HFP/HSP switch when a microphone opens
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
