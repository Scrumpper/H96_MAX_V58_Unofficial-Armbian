# H96/RK3588 VPU decode: rkmpp zero-copy, then rkmpp-copy, then software
profile=fast
hwdec=rkmpp,rkmpp-copy
vo=gpu
# GL context: drmprime zero-copy interop needs EGL dmabuf (no Vulkan dmabuf interop in this build)
gpu-api=opengl
# decoder frame queue: AV1 4K60 on the single AV1 core needs it to hold 60 fps
vd-queue-enable=yes
vd-queue-max-samples=8
# 8-bit VP9 first (vp9.2 HDR decodes in software), then AV1 SDR (VPU), up to 4K
ytdl-format=bestvideo[height<=?2160][vcodec=vp9]+bestaudio/bestvideo[height<=?2160][vcodec^=av01][dynamic_range=SDR]+bestaudio/bestvideo[height<=?2160][vcodec!*=av01]+bestaudio/best[height<=?2160]
ytdl-raw-options=js-runtimes=node
cache=yes
demuxer-max-bytes=64MiB
cursor-autohide=1000
# fullscreen skips KWin compositing (drops at 4K output)
x11-bypass-compositor=fs-only
# bundled yt-dlp, refreshed by h96-ytdlp-update.timer
script-opts-append=ytdl_hook-ytdl_path=/var/lib/h96/bin/yt-dlp
# Plasma Wayland session: dmabuf-wayland presents decoded frames (fewest drops and lowest CPU of Wayland paths;
# 4K60 still drops frames on Wayland, X11 does not); X11 and console keep vo=gpu above
[h96-wayland]
profile-cond=os.getenv("XDG_SESSION_TYPE") == "wayland" and os.getenv("WAYLAND_DISPLAY") ~= nil
profile-restore=copy
vo=dmabuf-wayland
# back to top level: lines appended later (h96-audio-passthrough include) stay global
[default]
