# /etc/mpv/hdr-kms.conf: HDR10 playback on a KMS VT; read only by h96-hdr play (--include)
# VPU frames (NV15/NV12) scanned out as is on Esmart0, OSD on Cluster1 (h96-vp0-plane overlay)
vo=gpu
gpu-context=drm
gpu-api=opengl
drm-connector=HDMI-A-1
hwdec=rkmpp
gpu-hwdec-interop=drmprime-overlay
drm-drmprime-video-plane=primary
drm-draw-plane=overlay
# undo an X11 tonemap include (h96-hdr tonemap) for this run
target-prim=auto
target-trc=auto
fullscreen=yes
osd-level=1
# keyboard on the VT; q quits back to the desktop
input-terminal=yes
