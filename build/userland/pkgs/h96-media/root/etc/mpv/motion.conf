# /etc/mpv/motion.conf - managed by h96-motion. Included into mpv.conf only while
# motion smoothing is ON. Edits here are overwritten on toggle.
#
# Motion smoothing via mpv's BUILT-IN frame interpolation (vo=gpu). This resamples
# video to the display refresh rate and blends frames, which cuts 24fps judder on
# pans. It runs on the Mali GPU and works with hwdec=rkmpp (zero-copy), so it adds
# almost no CPU. It is NOT motion-compensated ("SVP soap-opera") interpolation -
# that path needs VapourSynth + MVTools, which have NO arm64 build in this box's
# repos and are not shipped. This is the honest, dependency-free alternative.
video-sync=display-resample
interpolation=yes
tscale=oversample
# tscale=oversample = sharp judder reduction. For softer frame blending instead,
# set tscale=mitchell. Leave hwdec at the base rkmpp; interpolation is GPU-side.
