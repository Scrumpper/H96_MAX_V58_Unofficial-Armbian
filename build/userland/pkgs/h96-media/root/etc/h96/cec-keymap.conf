# /etc/h96/cec-keymap.conf: CEC key name (lowercase) -> KEY_* symbol from linux/input-event-codes.h; edit, then `systemctl restart h96-cec.service`.
# Only overrides need listing; unset keys use the built-in default (see h96-cecd DEFAULT_MAP).
#
# Navigation
select      = KEY_ENTER
up          = KEY_UP
down        = KEY_DOWN
left        = KEY_LEFT
right       = KEY_RIGHT
exit        = KEY_ESC
back        = KEY_ESC     # Back acts as Escape (Steam Big Picture, dialogs)
return      = KEY_ESC
root-menu   = KEY_MENU
info        = KEY_INFO
#
# Media transport: X11 media keys -> KDE media controller -> MPRIS (mpv via mpv-mpris, Chromium); Kodi
play        = KEY_PLAYCD
pause       = KEY_PAUSECD
stop        = KEY_STOPCD
rewind      = KEY_REWIND
fast-forward= KEY_FASTFORWARD
forward     = KEY_NEXTSONG
backward    = KEY_PREVIOUSSONG
#
# Volume (usually the box handles volume; TVs often keep these local)
volume-up   = KEY_VOLUMEUP
volume-down = KEY_VOLUMEDOWN
mute        = KEY_MUTE
#
# Power: standby = box standby (systemctl poweroff) only while /etc/h96/cec-power-standby.on
# exists (off by default); without that file power sends KEY_POWER
power       = standby
#
# For Kodi you may prefer back -> KEY_BACKSPACE instead of KEY_BACK:
# back      = KEY_BACKSPACE
