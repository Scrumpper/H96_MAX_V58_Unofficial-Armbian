# NetworkManager's D-Bus wpa_supplicant control never completes WiFi on the vendor bcmdhd driver; a directly invoked wpa_supplicant connects cleanly, so wlan0 goes to a standalone wpa_supplicant + dhcpcd pair (h96-wpa-supplicant-wlan0.service / h96-dhcpcd-wlan0.service) and NetworkManager keeps wired networking.
[keyfile]
unmanaged-devices=interface-name:wlan0
