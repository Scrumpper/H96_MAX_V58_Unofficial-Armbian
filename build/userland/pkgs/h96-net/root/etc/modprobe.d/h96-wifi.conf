# AP6275P / BCM43752 PCIe WiFi uses the vendor bcmdhd driver; brcmfmac lacks full 43752-PCIe support, so blacklist it.
blacklist brcmfmac
# Quiets bcmdhd's verbose init chatter (dhd_msg_level=0 disables info spam).
options bcmdhd firmware_path=/lib/firmware/brcm/fw_bcm43752a2_pcie_ag.bin nvram_path=/lib/firmware/brcm/nvram_ap6275p.txt dhd_msg_level=0 dhd_console_ms=0
