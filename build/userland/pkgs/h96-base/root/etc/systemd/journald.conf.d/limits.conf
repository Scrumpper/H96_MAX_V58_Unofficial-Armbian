# v4.3 journald caps.
# Storage=persistent is DELIBERATE: this box brown-outs and wedges under GPU and
# Waydroid load, and a volatile journal loses exactly the boot that has to be read
# back afterwards. The cost is bounded instead of removed - 200M on eMMC, 32M in
# tmpfs, compressed, and rate limited so a screaming unit cannot fill either.
[Journal]
Storage=persistent
SystemMaxUse=200M
RuntimeMaxUse=32M
Compress=yes
RateLimitIntervalSec=30s
RateLimitBurst=1000
